name: Validate MkDocs site

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for git revision dates
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install deployment tooling
        run: npm ci

      - name: Test public source and publisher boundaries
        run: npm test
      
      - name: Build and validate Cloudflare package
        run: npm run check:deploy
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bastet-targets-site
          path: ./site
